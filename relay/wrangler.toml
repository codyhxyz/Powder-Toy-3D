# Multiplayer relay (see worker.js).
#   local:  wrangler dev --config relay/wrangler.toml       → ws://localhost:8787
#   deploy: wrangler deploy --config relay/wrangler.toml    → set VITE_RELAY_URL=wss://<worker host> for the site build
name = "powder-toy-relay"
main = "worker.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "AI_QUOTA"
class_name = "AiQuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AiQuota"]

# Free construction AI (ai.js): wrangler secret put OPENAI_API_KEY (and AI_SALT, any random string)
