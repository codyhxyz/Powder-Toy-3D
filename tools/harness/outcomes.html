<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outcome bench</title>
<style>
  body { font: 13px/1.45 ui-monospace, monospace; margin: 16px; background: #111; color: #ddd; }
  a { color: #8cf; }
  table { border-collapse: collapse; margin: 8px 0 16px; }
  td, th { border-bottom: 1px solid #333; padding: 2px 10px 2px 0; text-align: left; vertical-align: top; }
  .pass { color: #7d7; } .fail { color: #f77; } .error { color: #fb5; } .na { color: #999; }
  textarea { width: 100%; height: 12em; background: #000; color: #ccc; font: inherit; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<!-- tools/outcomes.mjs drives this page (the outcome bench, docs/v2.md 11
     "Week 0"): each test's scene on a bare simulation on this page's WebGPU
     device, no app. Opened by hand (`npm run harness`, then
     /tools/harness/outcomes.html on the Mac's Chrome or Safari), it lists the
     groups; ?run=<group or test names>&engine=v1|v2 runs them here and prints
     the table and a JSON blob to paste back. -->
<div id="menu"></div>
<table id="results" hidden><thead><tr><th>test</th><th>status</th><th>measured</th><th>wall s</th></tr></thead><tbody></tbody></table>
<textarea id="json" hidden readonly></textarea>
<pre id="log"></pre>
<script type="module" src="./outcomes.js"></script>
</body>
</html>
