<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #12151c; color: #e8e6e3; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    nav {
      position: fixed; left: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap;
      font: 13px/1 system-ui, sans-serif;
    }
    button {
      border: 0; border-radius: 6px; padding: 8px 10px; color: inherit;
      background: rgba(255, 255, 255, 0.08);
    }
    button[aria-pressed='true'] { background: #5a4a88; }
  </style>
</head>
<body>
  <!-- Dev tool, not shipped (vite.config.js builds index.html only).
       vite, then /tools/harness/character.html?character=woman
       Drag turns, the wheel zooms, same viewer as the loading screen. -->
  <canvas id="view"></canvas>
  <nav>
    <button type="button" data-character="woman">Female wizard</button>
    <button type="button" data-character="real">Male wizard</button>
    <button type="button" data-character="stick">Stickman</button>
    <button type="button" data-character="spartan">Spartan</button>
    <button type="button" data-character="boy">Boy</button>
    <button type="button" data-character="girl">Girl</button>
  </nav>
  <script type="module" src="./character.js"></script>
</body>
</html>
