# Production deploy: every push to main on GitHub builds the site and ships it
# to the Cloudflare Pages project tpt3d (https://tpt3d.codyh.xyz). GitHub main
# is the only source of production, so to deploy, push main.
#
# The token lives in the `production` environment, which only main can use,
# and it can only deploy Pages (account token "tpt3d GitHub Actions: Pages deploy").
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push replaces a deploy that's still waiting.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # The checks and the build. Publishing (the last job) waits for this and the V2 suite's long checks.
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # immutable pre-feature generator for exact legacy cell acceptance
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Cache CPU WGSL validator
        uses: actions/cache@v4
        id: naga-cache
        with:
          path: ~/.cargo/bin/naga
          key: ${{ runner.os }}-naga-cli-30.0.1
      - name: Install CPU WGSL validator
        if: steps.naga-cache.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version 30.0.1 --locked
      - name: Verify CPU WGSL validator
        run: |
          test "$("$HOME/.cargo/bin/naga" --version)" = "30.0.1"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1   # playwright is only for local headless checks
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check native terrain decoder and compiler
        run: |
          python -m pip install numpy==2.0.1 Pillow==12.2.0
          python -B -m unittest discover -s tools -p 'test_noita_save_decode.py'
          python -B tools/import-noita-terrain-test.py
      - run: node --test tools/check-mode-icons.mjs   # CPU-only: every gamemode has a valid credited menu emblem
      - run: node tools/check-map-previews.mjs   # every menu map, including source imports, has a square preview
      - run: node tools/check-browser-launch.mjs   # headless tests launch through tools/browser.mjs (CLAUDE.md)
      - run: node --test tests/industry/*.test.js
      - name: Check physical factory logic and shaders without a GPU
        run: |
          node tools/industry-hearth-check.mjs
          node tools/industry-physics-check.mjs
          node tools/industry-diagnostics-check.mjs
          node scripts/check-industry-factory-ui.mjs
      - run: node tools/check-gpu-deadline.mjs   # CPU-only: enforce total slot budget and cleanup ownership
      - run: node --test tools/pipeline-safety-cpu-check.mjs   # fake GPU: compiler concurrency, deadlines and cancellation
      - run: node --experimental-vm-modules --test tools/startup-safety-cpu-check.mjs   # fake browser: startup failure and safe restart
      - run: node tools/check-profiler-coverage.mjs   # never silently ship an incomplete GPU total
      - run: node tools/frame-profile.mjs --self-test   # a capture must include the voxel volume, not just meshes
      - run: node tools/check-move-work.mjs && node tools/render-read-cpu-check.mjs
      - run: npm run check:fields   # CPU shared-field ownership, packing, Box contracts; optional Naga CLI
      - run: node tools/world-render-source-cpu-check.mjs   # phase-1 exact raw source authority; not unified-render completion
      - run: npm run check:world-source-cuts   # owned native inputs, delayed feedback and final-submission lifetime (CPU)
      - run: node tools/detail-culling-cpu-check.mjs
      - run: node tools/detail-residency-check.mjs && node tools/detail-worker-check.mjs && node tools/far-lod-check.mjs && node tools/surface-mesh-check.mjs   # full-detail terrain ownership, streaming and material seams
      - run: node tools/post-reuse-cpu-check.mjs && node tools/view-inputs-check.mjs
      - run: npm run check:world-scenes   # staged native scene admission, real Three jitter hooks + fake GPU (not app activation)
      - run: npm run check:world-render-frame
      - run: npm run check:world-main-route # CPU owner/driver/Post/pacer; not native rendering proof
      - run: npm run check:world-pick
      - run: npm run check:world-still # CPU actual owner/driver/Post; explicit native scene transport mocks
      - run: npm run check:world-viewmodel-eye   # original one-eye hands, accepted-only easing + real guard (CPU, not App activation)
      - run: npm run check:world-mesh-light   # actual Three fragment variants/Naga + CPU optical/SH references; not GPU evidence
      - run: node tools/check-reflection-roots.mjs && node tools/check-clod-budget.mjs && node tools/resolution-check.mjs
      - run: node tools/check-opaque-surface.mjs   # liquid transitions must not skip opaque walls
      - run: node tools/check-normal-mapped-surfaces.mjs
      - run: node tools/wood-endgrain-cpu-check.mjs
      - run: node tools/check-cozy-materials.mjs   # CPU artwork, shader-view selection and water scope
      - run: node tools/check-noita-materials.mjs --validate-wgsl   # CPU Noita view: measured looks through the real WGSL, Descent variant labels, Naga
      - run: node tools/check-ready-volume-view.mjs   # keep terrain visible while a replacement shader compiles
      - run: node tools/volume-format-cpu-check.mjs   # CPU: read-format specializations against the generic volume shaders, startup and thumbnail gates + Naga
      - run: node tools/check-appearance.mjs && node tools/check-far-appearance.mjs
      - run: node tools/check-island-appearance.mjs && node tools/check-construction-appearance.mjs && node tools/check-wang-appearance.mjs
      - run: node tools/check-map-appearance.mjs
      - run: node tools/check-crystal-material.mjs
      - run: node tools/check-crystal-transmission.mjs
      - run: node tools/check-world-volume-inlining.mjs   # CPU-only: big-map volume shader's inlined march/field-read copies stay under their compile-cost ceilings
      - run: node tools/check-presentation.mjs   # tool-gun aim uses the simulation's Vec3, including shifted worlds
      - run: node tools/check-sprint.mjs   # CPU body/camera/animation: launch, late surge, braking, interruptions
      - run: node tools/check-strikes.mjs   # CPU quaternion strikes/wingbeats, bone frames, grips and repeat recovery
      - run: node tools/check-willow-cove.mjs   # CPU terrain: body-clear running circuit and village routes
      - run: node --test tools/check-city-folk.mjs   # composed world, exact legacy geometry, city bus/edit lifecycle
      - run: node tools/check-city-folk-terrain.mjs && node tools/check-city-folk-town.mjs && node tools/check-city-folk-nature.mjs && node tools/check-city-folk-bus.mjs
      - run: node --test tools/check-city-folk-neighborhood.mjs && node tools/check-village-buildings.mjs && node tools/check-village-interactions.mjs && node tools/check-village-orders.mjs
      - run: node tools/grapple-cpu-check.mjs   # CPU original Grappendix: force bands, air control, momentum and lifecycle
      - run: node tools/mission-node-check.mjs && node tools/mission-retry-cpu-check.mjs && node --test tools/import-cruelty-map-check.mjs
      - run: node tools/check-world-fit.mjs && node tools/check-load-watch.mjs   # every World world fits the WORLD renderer; a stalled/failed load is flagged, never spins
      - run: node scripts/check-noita-fold.mjs && node scripts/check-noita-materials.mjs && node scripts/check-noita-source.mjs && node scripts/check-terrain-handoff.mjs && node scripts/check-terrain-raster.mjs --naga && node scripts/check-terrain-edits.mjs && node tools/gpu-readback-check.mjs   # immutable terrain, invertible fold, persistent handoffs and CPU validation of full GPU shaders
      - run: node scripts/check-descent-switch.mjs && node scripts/check-descent-temple.mjs && node scripts/check-descent-items.mjs   # legacy fixtures and shared run/item rules
      - name: Ensure ImageMagick for source appearance fixtures
        run: |
          if ! command -v magick >/dev/null && ! command -v convert >/dev/null; then
            sudo apt-get update && sudo apt-get install -y imagemagick
          fi
      - run: node --test tools/appearance-conversion-check.mjs tools/check-source-appearance.mjs tools/check-cruelty-post.mjs && node tools/source-appearance-gpu-check.mjs --cpu
      - run: node --test tools/imported-interactions-check.mjs tools/door-motion-check.mjs tools/imported-door-motion-check.mjs && node tools/imported-door-passage-check.mjs
      - run: node tools/cruelty-use-cpu-check.mjs   # compact source-only prompt, real actions and keyboard/touch guards
      - run: node tools/ladder-cpu-check.mjs && node tools/cruelty-enemies-cpu-check.mjs
      - run: node --experimental-vm-modules tools/world-coop-cpu-check.mjs   # host window, guest bodies and leash
      - run: node tools/jetpack-figure-check.mjs   # CPU rigs/GLB: visible packs, animated nozzle origins and exhaust
      - run: node tools/check-village-jump.mjs   # CPU charged jump, half gravity, cancellations and Three.js clips
      - run: node tools/check-body-gravity.mjs   # CPU: the body's jump, jet, pogo, swim and gravity modes match under V1 and V2 (Noita's gravity)
      - run: node tools/check-radial-projectiles.mjs   # CPU: shots, throws, frags, wand bolts and bot lobs fall toward the centre under radial gravity; normal gravity's paths bit for bit
      - run: node tools/enemy-aim-cpu-check.mjs   # persistent tracking, bursts, cover, real firearm spread
      - run: node tools/check-village.mjs && node tools/check-village-shapes.mjs && node tools/check-village-actions.mjs && node tools/check-village-punch.mjs && node tools/check-village-speech.mjs && node tools/check-village-residents.mjs   # character shapes, peaceful punches, tools, furniture and neighbor dialogue
      - run: node tools/check-village-crook.mjs && node tools/check-village-debt-badge.mjs   # CPU doorstep dialogue, persistent debt and shrink/glide HUD
      - run: node tools/check-character-models.mjs && node tools/check-loading-character.mjs   # CPU-only bodies, selection and portraits
      - run: node tools/check-shot-particles.mjs   # generated WGSL must age particles in every fade mode
      - run: node tools/firearm-aim-check.mjs && node tools/held-tools-check.mjs
      - run: node tools/viewmodel-arms-check.mjs   # CPU GLBs: muscular view arms, grip alignment, live selection and disposal
      - run: node tools/torch-cpu-check.mjs   # water quenching and frame-rate-independent flame inertia
      - run: node tools/npc-held-check.mjs
      - run: node tools/shrine-interact-cpu-check.mjs
      - run: node tools/hotbar-cpu-check.mjs
      - run: node tools/check-weather-wire.mjs && node tools/check-weather.mjs
      - run: node tools/lighthouse-cpu-check.mjs --wgsl   # CPU: the island lighthouse's lamp lifecycle, beacon uniforms and its shader variants + Naga
      - run: node tools/check-sprint-blur.mjs && node tools/check-sprint-music.mjs
      - run: node --test tools/world-atlas-cpu-check.mjs   # sparse world ABI v2: independent LIGHT/pools, typed feedback, publication/copy + Naga (no GPU)
      - run: npm run check:world-backend   # shared full world shader/assembly + actual Naga; NOT application activation
      - run: node --test tools/world-view-early-cpu-check.mjs   # one World view module for every world size, started with the map's build and reused by its first frame (CPU/Naga)
      - run: npm run check:world-signs   # native global sign endpoint + accepted frozen DOM; CPU/Naga, not App activation
      - run: npm run check:world-opaque   # actual HDR/depth packing, leased destinations; CPU/Naga, not GPU parity
      - run: node tools/naga-file-check.mjs   # CPU: every check hands naga a file with a deadline, never its stdin (a stdin pipe can hang on macOS)
      - run: npm run check:world-plain   # original voxel look/global rays, native three-phase blends + Naga; NOT app activation
      - run: node --test tools/world-ray-shadow-cpu-check.mjs   # production DDA/PCSS CPU arithmetic + Naga, not GPU parity
      - run: npm run check:world-sun   # CPU references/native recording + actual full optical Naga; NOT application activation
      - run: npm run check:world-lighting-records   # submitted metadata, precise native word delta, logical ages (CPU/Naga only)
      - run: npm run check:world-lighting-inputs   # concrete native reader/ticket/pool-prefix seams; no app activation
      - run: npm run check:world-render-owner   # actual data owner + delayed native transport; NOT App/GPU/visual acceptance
      - run: npm run check:world-sun-forecast   # sun-caster forecast holds every resident caster of each World scene, below the blind ask
      - run: npm run check:world-native-preflight   # actual Three cache/native-backend completion; CPU stubs, no GPU claims
      - run: npm run check:world-cells   # actual Source/Fields/classified CELL native transport + Naga, not GPU parity
      - run: npm run check:world-gi-glow   # shared world GI/glow producers, bounded history/native recording + Naga; NOT application activation
      - run: npm run check:world-gi-birth   # explicit native-history initialization/adoption; CPU fake transport, no app activation
      - run: node tools/check-edge-sea.mjs   # CPU: the sea past a map's edge (big maps and small) where its water reaches it; Naga validates the sky and floor grid shaders
      - run: node tools/check-sky-clouds.mjs   # CPU: the sky's cloud deck is its shadows' (same field, slices, constants, switch), on over every map; Naga validates the sky shader
      - run: node tools/check-sampler-budget.mjs   # no program binds more than 16 textures (a black screen otherwise)
      - run: node tools/hybrid-check.mjs   # CPU/Naga: all hybrid producers, actual stage layouts and six grid shapes
      - run: node tools/hybrid-test-view-check.mjs   # CPU-only: explicit Test activation, teardown, and warning UI
      - run: node tools/v2/cpu-suite.mjs --skip-long   # Physics V2's CPU checks (fake GPU, CPU twins, Naga) and the import/state-access lints; the long ones run in v2-long
      - run: npm run build
      - run: node tools/check-local-map-build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # The V2 CPU suite's long checks (column-wgsl-check: minutes), beside the deploy job's.
  v2-long:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Cache CPU WGSL validator
        uses: actions/cache@v4
        id: naga-cache
        with:
          path: ~/.cargo/bin/naga
          key: ${{ runner.os }}-naga-cli-30.0.1
      - name: Install CPU WGSL validator
        if: steps.naga-cache.outputs.cache-hit != 'true'
        run: |
          cargo install naga-cli --version 30.0.1 --locked
      - name: Verify CPU WGSL validator
        run: |
          test "$("$HOME/.cargo/bin/naga" --version)" = "30.0.1"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: node tools/v2/cpu-suite.mjs --only-long

  publish:
    needs: [deploy, v2-long]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tpt3d.codyh.xyz
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.84.1 pages deploy dist --project-name tpt3d --branch main \
            --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s)"
