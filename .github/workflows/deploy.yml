# Production deploy: every push to main on GitHub builds the site and ships it
# to the Cloudflare Pages project tpt3d (https://tpt3d.codyh.xyz). GitHub main
# is the only source of production, so to deploy, push main.
#
# The token lives in the `production` environment, which only main can use,
# and it can only deploy Pages (account token "tpt3d GitHub Actions: Pages deploy").
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # The build, the only thing publishing waits for: a push is live in a minute or two.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: node tools/check-browser-launch.mjs   # headless tests launch through tools/browser.mjs (CLAUDE.md)
      - run: npm run build
      - run: node tools/check-local-map-build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # A handful of fast CPU checks beside the build, each guarding a failure a player would hit
  # that the build itself can't catch. A failure shows red on the push but never holds the deploy.
  # The other check scripts in tools/ and scripts/ still run locally; they are not in CI on purpose.
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: node tools/check-imports.mjs   # shader/gfx/gpu modules import without a GPU or DOM at load time
      - run: node tools/check-sampler-budget.mjs   # no program binds more than 16 textures (a black screen otherwise)
      - run: node tools/check-world-fit.mjs && node tools/check-load-watch.mjs   # big maps fit the renderer; a stalled/failed load is flagged, never spins
      - run: node tools/check-map-previews.mjs   # every menu map has a square preview
      - run: node --test tools/check-mode-icons.mjs   # every gamemode has a valid menu emblem

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    # One publish at a time, in push order; the checks never queue a deploy.
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://tpt3d.codyh.xyz
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.84.1 pages deploy dist --project-name tpt3d --branch main \
            --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s)"
